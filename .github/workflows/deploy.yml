name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# A newer push should win, but never cancel a deploy that is mid-flight.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://fitness-dashboard-emv.pages.dev/
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: web

      - name: Typecheck
        run: npm run typecheck
        working-directory: web

      - name: Test
        run: npm test
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web
        env:
          # The anon/publishable key is a public identifier, not a secret: every
          # table is gated by row-level security. It lives in repo secrets only
          # to keep the project reference out of the committed source.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Cloudflare Pages serves from the root, unlike a GitHub Pages
          # project site which serves from /<repo>/.
          VITE_BASE_PATH: /

      - name: Refuse to publish an unconfigured build
        working-directory: web
        run: |
          if ! grep -rq "supabase.co" dist/assets/*.js; then
            echo "::error::Built bundle contains no Supabase URL. Are the repository secrets set?"
            exit 1
          fi
          if ! grep -q 'src="/assets/' dist/index.html; then
            echo "::error::Asset paths are not root-relative. VITE_BASE_PATH is wrong for Cloudflare Pages."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=fitness-dashboard --branch=main
          workingDirectory: web
